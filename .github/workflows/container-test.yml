name: Container compatibility checks

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'tests/smoke-image.sh'
      - '.github/workflows/container-test.yml'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Go tests using the builder toolchain
        run: docker run --rm -v "$PWD:/src" -w /src golang:1.21-alpine go test -mod=readonly ./...
      - name: Build the image without upgrading module dependencies
        run: docker build --pull -t sonarqube-scanner:test .
      - name: Verify PHP, Java, Node and scanner compatibility
        run: sh tests/smoke-image.sh sonarqube-scanner:test
