name: Container compatibility checks

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '*.go'
      - 'tests/smoke-image.sh'
      - '.github/workflows/container-test.yml'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Go tests using the builder toolchain
        run: docker run --rm -v "$PWD:/src" -w /src harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8 go test -mod=readonly ./...
      - name: Build the image without upgrading module dependencies
        run: docker build --pull --no-cache -t sonarqube-scanner:test .
      - name: Verify PHP, Java, Node and scanner compatibility
        run: sh tests/smoke-image.sh sonarqube-scanner:test
